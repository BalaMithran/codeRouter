# CodeRouter config. Dollar-brace env references substitute at startup (missing var = error).
default_provider: openai        # bare model ids forward here unchanged (M1 back-compat)

providers:
  openai:
    baseURL: https://api.openai.com/v1
    apiKey: ${CODEROUTER_OPENAI_KEY}   # namespaced: a global OPENAI_API_KEY in shell rc would shadow .env
  ollama:
    baseURL: ${CODEROUTER_OLLAMA_URL}   # bare-metal: localhost; docker-compose overrides to the ollama service
    # no apiKey — ollama ignores auth

virtual_models:
  cheap: openai/gpt-4.1-mini
  premium: openai/gpt-4.1
  # llama3.1:8b over qwen2.5-coder:7b: qwen emits tool calls as text, OpenCode needs native tool_calls
  offline: ollama/llama3.1:8b
  auto: auto                    # sentinel: strategy picks cheap | premium

privacy:
  # Matching requests ALWAYS route here — overrides explicit picks (even premium/gpt-4.1).
  # Fail-closed: if ollama is down the request 502s; never falls back to cloud.
  # Detection is path-string based: globs matched anywhere in the serialized request body.
  target: ollama/llama3.1:8b
  paths:
    - /auth/**
    - /payment/**
    - "**/secrets/**"

strategy:
  name: llm-classifier          # alternative: heuristic (no LLM call, thresholds only)
  classifier:
    target: openai/gpt-4.1-nano
    timeout_ms: 3000            # any failure/timeout/garbage -> silent heuristic fallback
  thresholds:                   # heuristic config (also the classifier's fallback path)
    long_chars: 32000           # ~8k tokens; above this the task carries real context
    many_messages: 12
    premium_score: 2            # score >= this -> premium
